[toolchain]
# Exact version, not "stable": the channel-rust-<ver>.toml manifest URL
# is immutable, so the flake.nix sha256 pin never drifts when a new
# stable ships. Bump = edit here + re-pin the sha256 in flake.nix.
channel = "1.97.1"
# minimal = rustc + cargo + rust-std only; the components below are
# added explicitly (drops rust-docs from the toolchain closure)
profile = "minimal"
components = [
  "rustfmt",
  "clippy",
  "rust-analyzer",
  "rust-src",
]
# Static-musl cross targets for `cargo athena build` (delivered as artifacts).
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]
