[toolchain]
channel = "stable"
# minimal = rustc + cargo + rust-std only; the components below are
# added explicitly. Drops rust-docs (never needed in CI/build) — keeps
# it out of the Nix toolchain closure that CI caches.
profile = "minimal"
components = [
  "rustfmt",
  "clippy",
  "rust-analyzer",
  "rust-src",
]
# Static-musl cross targets for `cargo athena build` (delivered as artifacts).
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]
