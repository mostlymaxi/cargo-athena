name: publish

# Publish the library + the `cargo athena` bin to crates.io on a
# version tag (`vX.Y.Z`). Manual `workflow_dispatch` is also allowed
# (publishes whatever version is in Cargo.toml).
#
# Requires repo secret CARGO_REGISTRY_TOKEN (a crates.io API token with
# publish-new + publish-update scope).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false   # never cancel a release mid-flight

permissions:
  contents: write   # create the GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          # Trust the cachix substituter at the *system* nix.conf level
          # — flake `nixConfig` is ignored non-interactively (untrusted).
          extra-conf: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
            accept-flake-config = true
      - uses: nix-community/cache-nix-action@v7
        with:
          # Same lean toolchain closure as test/clippy (.#ci); shares
          # their nix-<os>-ci- cache. Re-trial of the previously-removed
          # Nix-store cache — watch for GC/symlink/perms breakage.
          primary-key: nix-${{ runner.os }}-ci-${{ hashFiles('flake.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-ci-
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-ci-
          purge-created: 0
          purge-primary-key: never
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: require crates.io token
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set — cannot publish."
            exit 1
          fi

      - name: tag must match workspace version
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          v=$(awk '/^\[workspace.package\]/{f=1} f && /^version =/{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)
          tag="${GITHUB_REF_NAME#v}"
          echo "workspace version: $v   tag: $tag"
          if [ "$v" != "$tag" ]; then
            echo "::error::tag v$tag does not match [workspace.package] version $v"
            exit 1
          fi

      # Dependency order: api -> macros -> core -> facade -> cli.
      # `cargo publish` waits for each crate to land in the index before
      # returning, so the next crate resolves it from crates.io.
      - name: cargo publish (dependency order)
        run: |
          set -euo pipefail
          for c in cargo-athena-api cargo-athena-macros cargo-athena-core cargo-athena; do
            echo "::group::cargo publish -p $c"
            nix develop .#ci -c cargo publish -p "$c" --locked
            echo "::endgroup::"
          done

      # Only on a tag, and only after a successful publish (sequential
      # steps — skipped if the publish above failed). GitHub auto-builds
      # the notes by diffing commits since the previous release tag.
      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
