name: pages

# Build the mdBook docs site (docs/) with the nix-pinned mdbook and
# publish it to GitHub Pages. One-time repo setup: Settings -> Pages ->
# "Build and deployment" -> Source: GitHub Actions.
#
# Gated on `v*` tags (like publish.yml), NOT every push to main: the
# published site documents the *released* crate, so it must not run
# ahead of what's on crates.io. `workflow_dispatch` is kept for a
# manual rebuild of the current docs when needed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          # Trust the cachix substituter at the *system* nix.conf level
          # — flake `nixConfig` is ignored non-interactively (untrusted).
          extra-conf: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
            accept-flake-config = true
      - uses: nix-community/cache-nix-action@v7
        with:
          # Tiny mdbook-only closure (.#docs, no rust). Isolated prefix.
          primary-key: nix-${{ runner.os }}-docs-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-docs-
          # No gc-max-store-size (save the whole docs closure).
          purge: true
          purge-prefixes: nix-${{ runner.os }}-docs-
          purge-created: 0
          purge-primary-key: never
      - run: nix develop .#docs -c mdbook build docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
