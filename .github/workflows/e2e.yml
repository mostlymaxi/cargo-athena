name: e2e

# Resource-heavy (real kind clusters per Argo version): PRs to main +
# main itself. main will be branch-protected on this.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cross-compile + package the athena binary tarball ONCE; the Argo
  # matrix below reuses it (no per-version rebuild).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The lean CI nix store (~1.7G) + restored cargo cache + the build
      # can exceed ubuntu-latest's ~14G free disk and crash the runner
      # with "No space left on device" (hit on the v0.6.0 main run).
      # Reclaim ~20G of preinstalled tooling we never use, before the nix
      # store + caches populate.
      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          # Trust the cachix substituter at the *system* nix.conf level
          # — flake `nixConfig` is ignored non-interactively (untrusted).
          extra-conf: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
            accept-flake-config = true
      # Restore-only: e2e.yml *consumes* the toolchain Nix-store cache
      # that test/clippy/publish populate (prefix nix-<os>-ci-) and
      # never uploads — 3 parallel matrix legs writing a multi-GB
      # closure would thrash the 10 GB repo budget. zig/cluster tools
      # come from cache.nixos.org. (cache-nix-action was removed once
      # for GC/symlink/perms breakage on save/restore; read-only use
      # can't hit the save-side failure modes.)
      - uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-ci-${{ hashFiles('flake.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-ci-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: cargo athena build (static-musl, all targets)
        env:
          ATHENA_CONFIG: scripts/athena.toml
          # Pin the version tag baked into the tarball (matches
          # e2e-test.sh) so the build is gate-free on CI's detached HEAD
          # and the emitted WT names line up with the prebuilt binary.
          ATHENA_VERSION_TAG: e2e
        run: |
          nix develop .#build -c cargo run -q -p cargo-athena --bin cargo-athena -- athena build \
            --package cargo-athena-example-e2e --bin e2e
      - uses: actions/upload-artifact@v4
        with:
          name: athena-e2e-tarball
          path: target/athena/e2e.tar.gz
          if-no-files-found: error
          retention-days: 3

  # One real kind cluster + Argo + MinIO per version, in parallel.
  e2e:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Argo maintains only the 2 most recent minors (release policy:
        # docs/releases.md): v4.0 + v3.7 are the support target. v3.6 is
        # our minimum supported version, kept green as a hard gate even
        # though EOL. Argo <= 3.5 is unsupported and intentionally NOT in
        # the matrix: its validator can't resolve {{tasks.X.outputs.*}}
        # across a templateRef boundary, which athena's one-WT-per-
        # #[container]/#[workflow] "wormhole" design requires. All legs
        # are blocking. All = latest patch.
        argo:
          - v4.0.5    # maintained (latest minor)
          - v3.7.14   # maintained (n-1 minor)
          - v3.6.19   # minimum supported (EOL, hard gate)
    runs-on: ubuntu-latest
    name: e2e (argo ${{ matrix.argo }})
    # `secrets` isn't a valid context in a step `if:`; job-level env can
    # read it, so collapse "both badge secrets present" into one flag.
    env:
      BADGE_ENABLED: ${{ secrets.BADGE_GIST_ID != '' && secrets.GIST_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      # The lean CI nix store (~1.7G) + restored cargo cache + the build
      # can exceed ubuntu-latest's ~14G free disk and crash the runner
      # with "No space left on device" (hit on the v0.6.0 main run).
      # Reclaim ~20G of preinstalled tooling we never use, before the nix
      # store + caches populate.
      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          # Trust the cachix substituter at the *system* nix.conf level
          # — flake `nixConfig` is ignored non-interactively (untrusted).
          extra-conf: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
            accept-flake-config = true
      # Restore-only toolchain cache (see the build job) — no upload.
      - uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-ci-${{ hashFiles('flake.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-ci-
      - uses: actions/download-artifact@v4
        with:
          name: athena-e2e-tarball
          path: dist
      - name: deploy + e2e against Argo ${{ matrix.argo }}
        env:
          ARGO_VERSION: ${{ matrix.argo }}
          ATHENA_SKIP_BUILD: "1"
          ATHENA_TARBALL: ${{ github.workspace }}/dist/e2e.tar.gz
        run: |
          nix develop .#e2e -c bash -c 'scripts/deploy.sh && scripts/e2e-test.sh'
      - name: teardown
        if: always()
        run: nix develop .#e2e -c scripts/teardown.sh || true

      # Per-version live status for the README table. GitHub has no
      # per-matrix-job badge, so each job publishes pass/fail to a gist
      # that shields.io endpoint badges read. Skipped entirely (not just
      # non-fatal) until BADGE_GIST_ID + GIST_TOKEN secrets exist —
      # otherwise it PATCHes an empty gist id and 404s every run.
      # `!cancelled()` (not `always()`): a concurrency-superseded run is
      # `cancelled`, where `job.status != 'success'` would wrongly write
      # `failing` and clobber the badge until the next run fixes it
      # (caches then keep showing red). Still runs on real pass/fail.
      - name: publish status badge
        if: >-
          ${{ !cancelled() && github.ref == 'refs/heads/main'
              && env.BADGE_ENABLED == 'true' }}
        continue-on-error: true
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.BADGE_GIST_ID }}
          filename: athena-argo-${{ matrix.argo }}.json
          label: argo ${{ matrix.argo }}
          message: ${{ job.status == 'success' && 'passing' || 'failing' }}
          # Match GitHub's native Actions badge palette (not shields'
          # neon brightgreen #4c1), so these sit consistently next to the
          # clippy/test/e2e workflow badges.
          color: ${{ job.status == 'success' && '2da44e' || 'cf222e' }}
