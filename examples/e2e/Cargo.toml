[package]
name = "cargo-athena-example-e2e"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

# The ONLY crate the kind e2e (GitHub Actions) builds + submits to a real
# Argo + MinIO (scripts/e2e-test.sh, .github/workflows/e2e.yml). Scoped to
# features PROVEN end-to-end on real Argo: workflow / nested-workflow /
# container / fragment / host! / save_artifact! / container->container AND
# workflow->container param data-deps (outputs.parameters.return resolved
# across the templateRef wormhole) / default+override image / multi-arch
# bootstrap.
[lib]
name = "cargo_athena_example_e2e"
path = "src/lib.rs"

[[bin]]
name = "e2e"
path = "src/main.rs"

[dependencies]
cargo-athena = { workspace = true }
