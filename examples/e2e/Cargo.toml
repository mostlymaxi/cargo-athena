[package]
name = "cargo-athena-example-e2e"
edition.workspace = true
version = "0.0.0"
license.workspace = true
publish = false

# The ONLY crate the kind e2e (GitHub Actions) builds + submits to a real
# Argo + MinIO (scripts/e2e-test.sh, .github/workflows/e2e.yml). One mega
# #[workflow] exercising the FULL feature matrix end-to-end so real-Argo
# bugs surface in CI: data-deps / nested-wf return / fan_out / if-else /
# nested call / struct-field / save+load_artifact / image injection /
# per-task hooks / node_selector / on_exit_if_root / host! + fragment /
# multi-arch bootstrap.
[lib]
name = "cargo_athena_example_e2e"
path = "src/lib.rs"

[[bin]]
name = "e2e"
path = "src/main.rs"

[dependencies]
cargo-athena = { workspace = true }
serde = { version = "1", features = ["derive"] }
