apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-e2e-sub-pipeline
spec:
  entrypoint: cargo-athena-example-e2e-sub-pipeline
  templates:
  - name: cargo-athena-example-e2e-sub-pipeline
    inputs:
      parameters:
      - name: seed
    outputs:
      parameters:
      - name: result
        valueFrom:
          parameter: '{{tasks.transform.outputs.result}}'
    dag:
      tasks:
      - name: fetched
        arguments:
          parameters:
          - name: url
            value: '{{inputs.parameters.seed}}'
        templateRef:
          name: cargo-athena-example-e2e-fetch
          template: cargo-athena-example-e2e-fetch
      - name: transform
        dependencies:
        - fetched
        arguments:
          parameters:
          - name: data
            value: '{{tasks.fetched.outputs.result}}'
          - name: factor
            value: '7'
        templateRef:
          name: cargo-athena-example-e2e-transform
          template: cargo-athena-example-e2e-transform
---
