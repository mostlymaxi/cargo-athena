apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pipeline-tolerations
  labels:
    cargo.athena/bin: smoke-tolerations
    cargo.athena/pkg: cargo-athena-example-smoke
    cargo.athena/toolchain: 0.5.2
    cargo.athena/version: 0.0.0
spec:
  entrypoint: cargo-athena-example-smoke-pipeline-tolerations
  templates:
  - name: cargo-athena-example-smoke-pipeline-tolerations
    inputs:
      parameters:
      - name: role
    dag:
      tasks:
      - name: run-on-tainted-node
        arguments:
          parameters:
          - name: kind
            value: '{{inputs.parameters.role}}'
        templateRef:
          name: cargo-athena-example-smoke-run-on-tainted-node
          template: cargo-athena-example-smoke-run-on-tainted-node
  tolerations:
  - key: athena.dev/{{=fromJSON(workflow.parameters['role'])}}
    operator: Exists
    effect: NoSchedule
  volumeClaimTemplates:
  - metadata:
      name: cargo-athena-example-smoke-buildcache
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-run-on-tainted-node
  labels:
    cargo.athena/bin: smoke-tolerations
    cargo.athena/pkg: cargo-athena-example-smoke
    cargo.athena/toolchain: 0.5.2
    cargo.athena/version: 0.0.0
spec:
  entrypoint: cargo-athena-example-smoke-run-on-tainted-node
  templates:
  - name: cargo-athena-example-smoke-run-on-tainted-node
    inputs:
      parameters:
      - name: kind
      artifacts:
      - name: athena-dist
        path: /athena/bin
        s3:
          endpoint: s3.amazonaws.com
          bucket: athena-artifacts
          region: us-east-1
          key: cargo-athena-example-smoke/0.0.0/smoke-tolerations.tar.gz
          accessKeySecret:
            name: athena-s3
            key: accessKey
          secretKeySecret:
            name: athena-s3
            key: secretKey
    outputs:
      parameters:
      - name: return
        valueFrom:
          path: /athena/result
    container:
      image: busybox:1.36-musl
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -e
        case "$(uname -m)" in
          x86_64) __t=x86_64-unknown-linux-musl ;;
          aarch64|arm64) __t=aarch64-unknown-linux-musl ;;
          *) echo "athena: unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        chmod +x /athena/bin/app-$__t
        export CARGO_ATHENA_OUTPUT=/athena/result
        exec /athena/bin/app-$__t "$@"
      - --
      - '{{inputs.parameters.kind}}'
      env:
      - name: CARGO_ATHENA_TEMPLATE
        value: cargo-athena-example-smoke-run-on-tainted-node
      volumeMounts:
      - name: athena-work
        mountPath: /athena
    volumes:
    - name: athena-work
      emptyDir: {}
    serviceAccountName: default
    tolerations:
    - key: athena.dev/{{=fromJSON(inputs.parameters['kind'])}}
      operator: Exists
      effect: NoSchedule
  volumeClaimTemplates:
  - metadata:
      name: cargo-athena-example-smoke-buildcache
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
