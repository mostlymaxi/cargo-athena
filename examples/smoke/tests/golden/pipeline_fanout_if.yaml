apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pipeline-fanout-if-0-0-0
  labels:
    cargo.athena/bin: smoke-fanout-if
    cargo.athena/channel: release
    cargo.athena/pkg: cargo-athena-example-smoke
    cargo.athena/tag: 0-0-0
    cargo.athena/toolchain: 0.7.1
    cargo.athena/version: 0.0.0
spec:
  entrypoint: cargo-athena-example-smoke-pipeline-fanout-if
  templates:
  - name: cargo-athena-example-smoke-pipeline-fanout-if
    dag:
      tasks:
      - name: cnt
        arguments:
          parameters:
          - name: seed
            value: '"hello"'
        templateRef:
          name: cargo-athena-example-smoke-decide-0-0-0
          template: cargo-athena-example-smoke-decide
      - name: if
        dependencies:
        - cnt
        arguments:
          parameters:
          - name: cnt
            value: '{{tasks.cnt.outputs.parameters.return}}'
        templateRef:
          name: cargo-athena-example-smoke-pipeline-fanout-if-if0-0-0-0
          template: cargo-athena-example-smoke-pipeline-fanout-if-if0
  volumeClaimTemplates:
  - metadata:
      name: cargo-athena-example-smoke-buildcache
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
---
