apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pipeline-fanout-if-if0-arm0-0-0-0
  labels:
    cargo.athena/bin: smoke-fanout-if
    cargo.athena/channel: release
    cargo.athena/pkg: cargo-athena-example-smoke
    cargo.athena/tag: 0-0-0
    cargo.athena/toolchain: 0.7.1
    cargo.athena/version: 0.0.0
spec:
  entrypoint: cargo-athena-example-smoke-pipeline-fanout-if-if0-arm0
  templates:
  - name: cargo-athena-example-smoke-pipeline-fanout-if-if0-arm0
    inputs:
      parameters:
      - name: cnt
    dag:
      tasks:
      - name: a
        arguments: {}
        templateRef:
          name: cargo-athena-example-smoke-make-list-0-0-0
          template: cargo-athena-example-smoke-make-list
      - name: b
        dependencies:
        - a
        arguments:
          parameters:
          - name: s
            value: '{{item}}'
          - name: suffix
            value: '"!"'
        templateRef:
          name: cargo-athena-example-smoke-caps-0-0-0
          template: cargo-athena-example-smoke-caps
        withParam: '{{tasks.a.outputs.parameters.return}}'
      - name: summarize
        dependencies:
        - b
        arguments:
          parameters:
          - name: items
            value: '{{=let g = tasks?.[''b'']; let p = g?.outputs?.parameters; let r = (type(p) == "map" ? p?.[''return''] : nil) ?? "[]"; let s = r == "" || r == "null" ? "[]" : r; toJSON(map(fromJSON(s), { type(#) == "string" ? fromJSON(#) : # }))}}'
        templateRef:
          name: cargo-athena-example-smoke-summarize-0-0-0
          template: cargo-athena-example-smoke-summarize
  volumeClaimTemplates:
  - metadata:
      name: cargo-athena-example-smoke-buildcache
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
---
