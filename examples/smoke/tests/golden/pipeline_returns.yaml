apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-sub-pipeline-0-0-0
  labels:
    cargo.athena/bin: smoke-returns
    cargo.athena/channel: release
    cargo.athena/pkg: cargo-athena-example-smoke
    cargo.athena/tag: 0-0-0
    cargo.athena/toolchain: 0.8.0
    cargo.athena/version: 0.0.0
spec:
  entrypoint: cargo-athena-example-smoke-sub-pipeline
  templates:
  - name: cargo-athena-example-smoke-sub-pipeline
    inputs:
      parameters:
      - name: seed
    outputs:
      parameters:
      - name: return
        valueFrom:
          parameter: '{{tasks.transform.outputs.parameters.return}}'
    dag:
      tasks:
      - name: fetched
        arguments:
          parameters:
          - name: url
            value: '{{inputs.parameters.seed}}'
        templateRef:
          name: cargo-athena-example-smoke-fetch-0-0-0
          template: cargo-athena-example-smoke-fetch
      - name: transform
        dependencies:
        - fetched
        arguments:
          parameters:
          - name: data
            value: '{{tasks.fetched.outputs.parameters.return}}'
          - name: factor
            value: '7'
        templateRef:
          name: cargo-athena-example-smoke-transform-0-0-0
          template: cargo-athena-example-smoke-transform
  volumeClaimTemplates:
  - metadata:
      name: cargo-athena-example-smoke-buildcache
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
---
