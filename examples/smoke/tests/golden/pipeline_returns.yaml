apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-fetch-0-0-0
  labels:
    cargo.athena/bin: smoke-returns
    cargo.athena/channel: release
    cargo.athena/pkg: cargo-athena-example-smoke
    cargo.athena/tag: 0-0-0
    cargo.athena/toolchain: 0.8.0
    cargo.athena/version: 0.0.0
spec:
  entrypoint: cargo-athena-example-smoke-fetch
  templates:
  - name: cargo-athena-example-smoke-fetch
    inputs:
      parameters:
      - name: url
      artifacts:
      - name: athena-dist
        path: /athena/bin
        s3:
          endpoint: s3.amazonaws.com
          bucket: athena-artifacts
          region: us-east-1
          key: cargo-athena-example-smoke/0-0-0/smoke-returns.tar.gz
          accessKeySecret:
            name: athena-s3
            key: accessKey
          secretKeySecret:
            name: athena-s3
            key: secretKey
    outputs:
      parameters:
      - name: return
        valueFrom:
          path: /athena/result
    container:
      image: ghcr.io/acme/fetch:1.2.3
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -e
        case "$(uname -m)" in
          x86_64) __t=x86_64-unknown-linux-musl ;;
          aarch64|arm64) __t=aarch64-unknown-linux-musl ;;
          *) echo "athena: unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        chmod +x /athena/bin/app-$__t
        export CARGO_ATHENA_OUTPUT=/athena/result
        exec /athena/bin/app-$__t "$@"
      - --
      - '{{inputs.parameters.url}}'
      env:
      - name: CARGO_ATHENA_TEMPLATE
        value: cargo-athena-example-smoke-fetch
      volumeMounts:
      - name: athena-work
        mountPath: /athena
      - name: host-4722dbf1d90eb665
        mountPath: /athena/mounts/4722dbf1d90eb665
    volumes:
    - name: athena-work
      emptyDir: {}
    - name: host-4722dbf1d90eb665
      hostPath:
        path: /secrets/token
    serviceAccountName: default
  volumeClaimTemplates:
  - metadata:
      name: cargo-athena-example-smoke-buildcache
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pipeline-returns-0-0-0
  labels:
    cargo.athena/bin: smoke-returns
    cargo.athena/channel: release
    cargo.athena/pkg: cargo-athena-example-smoke
    cargo.athena/tag: 0-0-0
    cargo.athena/toolchain: 0.8.0
    cargo.athena/version: 0.0.0
spec:
  entrypoint: cargo-athena-example-smoke-pipeline-returns
  templates:
  - name: cargo-athena-example-smoke-pipeline-returns
    dag:
      tasks:
      - name: r
        arguments:
          parameters:
          - name: seed
            value: '"seed"'
        templateRef:
          name: cargo-athena-example-smoke-sub-pipeline-0-0-0
          template: cargo-athena-example-smoke-sub-pipeline
      - name: publish
        dependencies:
        - r
        arguments:
          parameters:
          - name: report
            value: '{{tasks.r.outputs.parameters.return}}'
        templateRef:
          name: cargo-athena-example-smoke-publish-0-0-0
          template: cargo-athena-example-smoke-publish
  volumeClaimTemplates:
  - metadata:
      name: cargo-athena-example-smoke-buildcache
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
---
