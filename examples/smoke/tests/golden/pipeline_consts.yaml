apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pipeline-consts-0-0-0
  labels:
    cargo.athena/bin: smoke-consts
    cargo.athena/channel: release
    cargo.athena/pkg: cargo-athena-example-smoke
    cargo.athena/tag: 0-0-0
    cargo.athena/toolchain: 0.9.0
    cargo.athena/version: 0.0.0
spec:
  entrypoint: cargo-athena-example-smoke-pipeline-consts
  templates:
  - name: cargo-athena-example-smoke-pipeline-consts
    inputs:
      parameters:
      - name: count
    dag:
      tasks:
      - name: configure
        arguments:
          parameters:
          - name: o
            value: '{"maxItems":10,"label":"svc","speed":{"slow":2},"tags":["a","b"],"limit":5000000000}'
          - name: retries
            value: '3'
          - name: pair
            value: '[3000000000,"x"]'
        templateRef:
          name: cargo-athena-example-smoke-configure-0-0-0
          template: cargo-athena-example-smoke-configure
      - name: configure-2
        arguments:
          parameters:
          - name: o
            value: '{"maxItems":6,"label":"","speed":"fast","tags":[],"limit":null}'
          - name: retries
            value: '3'
          - name: pair
            value: '[7,"seven"]'
        templateRef:
          name: cargo-athena-example-smoke-configure-0-0-0
          template: cargo-athena-example-smoke-configure
        hooks:
          exit:
            templateRef:
              name: cargo-athena-example-smoke-note-0-0-0
              template: cargo-athena-example-smoke-note
            arguments:
              parameters:
              - name: msg
                value: '"svc"'
      - name: make-list
        arguments: {}
        templateRef:
          name: cargo-athena-example-smoke-make-list-0-0-0
          template: cargo-athena-example-smoke-make-list
      - name: caps
        dependencies:
        - make-list
        arguments:
          parameters:
          - name: s
            value: '{{item}}'
          - name: suffix
            value: '"svc"'
        templateRef:
          name: cargo-athena-example-smoke-caps-0-0-0
          template: cargo-athena-example-smoke-caps
        withParam: '{{tasks.make-list.outputs.parameters.return}}'
      - name: summarize
        dependencies:
        - caps
        arguments:
          parameters:
          - name: items
            value: '{{=let g = tasks?.[''caps'']; g == nil ? nil : (let p = g?.outputs?.parameters; let r = (type(p) == "map" ? p?.[''return''] : nil) ?? "[]"; let s = r == "" || r == "null" ? "[]" : r; toJSON(map(fromJSON(s), { type(#) == "string" ? fromJSON(#) : # })))}}'
        templateRef:
          name: cargo-athena-example-smoke-summarize-0-0-0
          template: cargo-athena-example-smoke-summarize
      - name: if0
        dependencies:
        - configure
        arguments:
          parameters:
          - name: count
            value: '{{inputs.parameters.count}}'
          - name: __athena_cond_0
            value: '1'
          - name: r
            value: '{{tasks.configure.outputs.parameters.return}}'
        templateRef:
          name: cargo-athena-example-smoke-pipeline-consts-if0-0-0-0
          template: cargo-athena-example-smoke-pipeline-consts-if0
      - name: consts-sub
        arguments:
          parameters:
          - name: o
            value: '{"maxItems":1,"label":"","speed":"fast","tags":[],"limit":null}'
          - name: waves
            value: '2'
        templateRef:
          name: cargo-athena-example-smoke-consts-sub-0-0-0
          template: cargo-athena-example-smoke-consts-sub
        hooks:
          exit:
            templateRef:
              name: cargo-athena-example-smoke-consts-sub-0-0-0
              template: cargo-athena-example-smoke-consts-sub
            arguments:
              parameters:
              - name: o
                value: '{"maxItems":1,"label":"","speed":"fast","tags":["t"],"limit":null}'
              - name: waves
                value: '1'
      - name: pick-speed
        arguments: {}
        templateRef:
          name: cargo-athena-example-smoke-pick-speed-0-0-0
          template: cargo-athena-example-smoke-pick-speed
      - name: if1
        dependencies:
        - pick-speed
        arguments:
          parameters:
          - name: __athena_cond_0
            value: 'false'
          - name: s
            value: '{{tasks.pick-speed.outputs.parameters.return}}'
          - name: __athena_cond_1
            value: '"fast"'
          - name: count
            value: '{{inputs.parameters.count}}'
        templateRef:
          name: cargo-athena-example-smoke-pipeline-consts-if1-0-0-0
          template: cargo-athena-example-smoke-pipeline-consts-if1
  volumeClaimTemplates:
  - metadata:
      name: cargo-athena-example-smoke-buildcache
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
---
