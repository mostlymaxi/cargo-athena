apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pipeline-deadline-0-0-0
  labels:
    cargo.athena/bin: smoke-deadline
    cargo.athena/channel: release
    cargo.athena/pkg: cargo-athena-example-smoke
    cargo.athena/tag: 0-0-0
    cargo.athena/toolchain: 0.6.1
    cargo.athena/version: 0.0.0
spec:
  entrypoint: cargo-athena-example-smoke-pipeline-deadline
  templates:
  - name: cargo-athena-example-smoke-pipeline-deadline
    dag:
      tasks:
      - name: slowtask
        arguments: {}
        templateRef:
          name: cargo-athena-example-smoke-slowtask-0-0-0
          template: cargo-athena-example-smoke-slowtask
      - name: slowtask2
        arguments: {}
        templateRef:
          name: cargo-athena-example-smoke-slowtask2-0-0-0
          template: cargo-athena-example-smoke-slowtask2
  activeDeadlineSeconds: 7200
  volumeClaimTemplates:
  - metadata:
      name: cargo-athena-example-smoke-buildcache
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-slowtask-0-0-0
  labels:
    cargo.athena/bin: smoke-deadline
    cargo.athena/channel: release
    cargo.athena/pkg: cargo-athena-example-smoke
    cargo.athena/tag: 0-0-0
    cargo.athena/toolchain: 0.6.1
    cargo.athena/version: 0.0.0
spec:
  entrypoint: cargo-athena-example-smoke-slowtask
  templates:
  - name: cargo-athena-example-smoke-slowtask
    inputs:
      artifacts:
      - name: athena-dist
        path: /athena/bin
        s3:
          endpoint: s3.amazonaws.com
          bucket: athena-artifacts
          region: us-east-1
          key: cargo-athena-example-smoke/0-0-0/smoke-deadline.tar.gz
          accessKeySecret:
            name: athena-s3
            key: accessKey
          secretKeySecret:
            name: athena-s3
            key: secretKey
    outputs:
      parameters:
      - name: return
        valueFrom:
          path: /athena/result
    container:
      image: busybox:1.36-musl
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -e
        case "$(uname -m)" in
          x86_64) __t=x86_64-unknown-linux-musl ;;
          aarch64|arm64) __t=aarch64-unknown-linux-musl ;;
          *) echo "athena: unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        chmod +x /athena/bin/app-$__t
        export CARGO_ATHENA_OUTPUT=/athena/result
        exec /athena/bin/app-$__t "$@"
      - --
      env:
      - name: CARGO_ATHENA_TEMPLATE
        value: cargo-athena-example-smoke-slowtask
      volumeMounts:
      - name: athena-work
        mountPath: /athena
    volumes:
    - name: athena-work
      emptyDir: {}
    serviceAccountName: default
    activeDeadlineSeconds: 600
  volumeClaimTemplates:
  - metadata:
      name: cargo-athena-example-smoke-buildcache
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
---
