apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pipeline-if-if1
spec:
  entrypoint: cargo-athena-example-smoke-pipeline-if-if1
  templates:
  - name: cargo-athena-example-smoke-pipeline-if-if1
    inputs:
      parameters:
      - name: cnt
      - name: chosen
      - name: m
    dag:
      tasks:
      - name: arm0
        arguments:
          parameters:
          - name: cnt
            value: '{{inputs.parameters.cnt}}'
          - name: chosen
            value: '{{inputs.parameters.chosen}}'
          - name: m
            value: '{{inputs.parameters.m}}'
        templateRef:
          name: cargo-athena-example-smoke-pipeline-if-if1-arm0
          template: cargo-athena-example-smoke-pipeline-if-if1-arm0
        when: ({{inputs.parameters.cnt}} == 0)
      - name: arm1
        arguments:
          parameters:
          - name: cnt
            value: '{{inputs.parameters.cnt}}'
          - name: chosen
            value: '{{inputs.parameters.chosen}}'
          - name: m
            value: '{{inputs.parameters.m}}'
        templateRef:
          name: cargo-athena-example-smoke-pipeline-if-if1-arm1
          template: cargo-athena-example-smoke-pipeline-if-if1-arm1
        when: (!(({{inputs.parameters.cnt}} == 0)) && (({{=toJSON(fromJSON(inputs.parameters['m'])['id'])}} == "abc") && ({{inputs.parameters.cnt}} > 1)))
      - name: arm2
        arguments:
          parameters:
          - name: cnt
            value: '{{inputs.parameters.cnt}}'
          - name: chosen
            value: '{{inputs.parameters.chosen}}'
          - name: m
            value: '{{inputs.parameters.m}}'
        templateRef:
          name: cargo-athena-example-smoke-pipeline-if-if1-arm2
          template: cargo-athena-example-smoke-pipeline-if-if1-arm2
        when: (!(({{inputs.parameters.cnt}} == 0)) && !((({{=toJSON(fromJSON(inputs.parameters['m'])['id'])}} == "abc") && ({{inputs.parameters.cnt}} > 1))))
