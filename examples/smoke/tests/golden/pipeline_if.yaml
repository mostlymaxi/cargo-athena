apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pipeline-if-0-0-0
  labels:
    cargo.athena/bin: smoke-if
    cargo.athena/channel: release
    cargo.athena/pkg: cargo-athena-example-smoke
    cargo.athena/tag: 0-0-0
    cargo.athena/toolchain: 0.5.2
    cargo.athena/version: 0.0.0
spec:
  entrypoint: cargo-athena-example-smoke-pipeline-if
  templates:
  - name: cargo-athena-example-smoke-pipeline-if
    dag:
      tasks:
      - name: cnt
        arguments:
          parameters:
          - name: seed
            value: '"hello"'
        templateRef:
          name: cargo-athena-example-smoke-decide-0-0-0
          template: cargo-athena-example-smoke-decide
      - name: m
        arguments: {}
        templateRef:
          name: cargo-athena-example-smoke-make-meta-0-0-0
          template: cargo-athena-example-smoke-make-meta
      - name: chosen
        dependencies:
        - cnt
        arguments:
          parameters:
          - name: cnt
            value: '{{tasks.cnt.outputs.parameters.return}}'
        templateRef:
          name: cargo-athena-example-smoke-pipeline-if-if0-0-0-0
          template: cargo-athena-example-smoke-pipeline-if-if0
      - name: if
        dependencies:
        - chosen
        - cnt
        - m
        arguments:
          parameters:
          - name: cnt
            value: '{{tasks.cnt.outputs.parameters.return}}'
          - name: chosen
            value: '{{tasks.chosen.outputs.parameters.return}}'
          - name: m
            value: '{{tasks.m.outputs.parameters.return}}'
        templateRef:
          name: cargo-athena-example-smoke-pipeline-if-if1-0-0-0
          template: cargo-athena-example-smoke-pipeline-if-if1
  volumeClaimTemplates:
  - metadata:
      name: cargo-athena-example-smoke-buildcache
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pipeline-if-if0-0-0-0
  labels:
    cargo.athena/bin: smoke-if
    cargo.athena/channel: release
    cargo.athena/pkg: cargo-athena-example-smoke
    cargo.athena/tag: 0-0-0
    cargo.athena/toolchain: 0.5.2
    cargo.athena/version: 0.0.0
spec:
  entrypoint: cargo-athena-example-smoke-pipeline-if-if0
  templates:
  - name: cargo-athena-example-smoke-pipeline-if-if0
    inputs:
      parameters:
      - name: cnt
    outputs:
      parameters:
      - name: return
        valueFrom:
          expression: 'tasks[''arm0''].status == ''Succeeded'' ? tasks[''arm0''].outputs.parameters.return : tasks[''arm1''].outputs.parameters.return'
    dag:
      tasks:
      - name: arm0
        arguments:
          parameters:
          - name: cnt
            value: '{{inputs.parameters.cnt}}'
        templateRef:
          name: cargo-athena-example-smoke-pipeline-if-if0-arm0-0-0-0
          template: cargo-athena-example-smoke-pipeline-if-if0-arm0
        when: ({{inputs.parameters.cnt}} > 3)
      - name: arm1
        arguments:
          parameters:
          - name: cnt
            value: '{{inputs.parameters.cnt}}'
        templateRef:
          name: cargo-athena-example-smoke-pipeline-if-if0-arm1-0-0-0
          template: cargo-athena-example-smoke-pipeline-if-if0-arm1
        when: '!(({{inputs.parameters.cnt}} > 3))'
  volumeClaimTemplates:
  - metadata:
      name: cargo-athena-example-smoke-buildcache
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
---
