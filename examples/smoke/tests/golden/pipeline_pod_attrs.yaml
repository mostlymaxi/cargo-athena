apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pipeline-pod-attrs
spec:
  entrypoint: cargo-athena-example-smoke-pipeline-pod-attrs
  templates:
  - name: cargo-athena-example-smoke-pipeline-pod-attrs
    metadata:
      annotations:
        argo.io/wf-tier: '{{workflow.parameters.tier}}'
        team.athena/owner: platform
    dag:
      tasks:
      - name: run-svc
        arguments:
          parameters:
          - name: tag
            value: '"42"'
          - name: zone
            value: '"east"'
        templateRef:
          name: cargo-athena-example-smoke-run-svc
          template: cargo-athena-example-smoke-run-svc
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-run-svc
spec:
  entrypoint: cargo-athena-example-smoke-run-svc
  templates:
  - name: cargo-athena-example-smoke-run-svc
    metadata:
      annotations:
        team.athena/owner: platform
        trace.athena/run: run-{{=fromJSON(inputs.parameters['tag'])}}
    inputs:
      parameters:
      - name: tag
      - name: zone
      artifacts:
      - name: athena-dist
        path: /athena/bin
        s3:
          endpoint: s3.amazonaws.com
          bucket: athena-artifacts
          region: us-east-1
          key: athena/bin/example/0.1.0/app.tar.gz
          accessKeySecret:
            name: athena-s3
            key: accessKey
          secretKeySecret:
            name: athena-s3
            key: secretKey
    outputs:
      parameters:
      - name: return
        valueFrom:
          path: /athena/result
    container:
      image: ghcr.io/acme/svc:{{=fromJSON(inputs.parameters['tag'])}}
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -e
        case "$(uname -m)" in
          x86_64) __t=x86_64-unknown-linux-musl ;;
          aarch64|arm64) __t=aarch64-unknown-linux-musl ;;
          *) echo "athena: unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        chmod +x /athena/bin/app-$__t
        export CARGO_ATHENA_OUTPUT=/athena/result
        exec /athena/bin/app-$__t --cargo-athena-template cargo-athena-example-smoke-run-svc
      env:
      - name: ATHENA_PARAM_tag
        value: '{{inputs.parameters.tag}}'
      - name: ATHENA_PARAM_zone
        value: '{{inputs.parameters.zone}}'
      - name: LOG_LEVEL
        value: info
      - name: REGION
        value: us-{{=fromJSON(inputs.parameters['zone'])}}
      volumeMounts:
      - name: athena-work
        mountPath: /athena
      - name: host-dev-shm
        mountPath: /dev/shm
      - name: host-etc-ca-certs
        mountPath: /certs
        readOnly: true
      securityContext:
        privileged: true
    volumes:
    - name: athena-work
      emptyDir: {}
    - name: host-dev-shm
      hostPath:
        path: /dev/shm
    - name: host-etc-ca-certs
      hostPath:
        path: /etc/ca-certs
    serviceAccountName: default
