apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pipeline-pod-attrs
  labels:
    cargo.athena/bin: smoke-pod-attrs
    cargo.athena/pkg: cargo-athena-example-smoke
    cargo.athena/toolchain: 0.5.2
    cargo.athena/version: 0.0.0
spec:
  entrypoint: cargo-athena-example-smoke-pipeline-pod-attrs
  templates:
  - name: cargo-athena-example-smoke-pipeline-pod-attrs
    metadata:
      annotations:
        argo.io/wf-tier: '{{workflow.parameters.tier}}'
        team.athena/owner: platform
    dag:
      tasks:
      - name: run-svc
        arguments:
          parameters:
          - name: tag
            value: '"42"'
          - name: zone
            value: '"east"'
        templateRef:
          name: cargo-athena-example-smoke-run-svc
          template: cargo-athena-example-smoke-run-svc
  volumeClaimTemplates:
  - metadata:
      name: cargo-athena-example-smoke-buildcache
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-run-svc
  labels:
    cargo.athena/bin: smoke-pod-attrs
    cargo.athena/pkg: cargo-athena-example-smoke
    cargo.athena/toolchain: 0.5.2
    cargo.athena/version: 0.0.0
spec:
  entrypoint: cargo-athena-example-smoke-run-svc
  templates:
  - name: cargo-athena-example-smoke-run-svc
    metadata:
      annotations:
        team.athena/owner: platform
        trace.athena/run: run-{{=fromJSON(inputs.parameters['tag'])}}
    inputs:
      parameters:
      - name: tag
      - name: zone
      artifacts:
      - name: athena-dist
        path: /athena/bin
        s3:
          endpoint: s3.amazonaws.com
          bucket: athena-artifacts
          region: us-east-1
          key: cargo-athena-example-smoke/0.0.0/smoke-pod-attrs.tar.gz
          accessKeySecret:
            name: athena-s3
            key: accessKey
          secretKeySecret:
            name: athena-s3
            key: secretKey
    outputs:
      parameters:
      - name: return
        valueFrom:
          path: /athena/result
    container:
      image: ghcr.io/acme/svc:{{=fromJSON(inputs.parameters['tag'])}}
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -e
        case "$(uname -m)" in
          x86_64) __t=x86_64-unknown-linux-musl ;;
          aarch64|arm64) __t=aarch64-unknown-linux-musl ;;
          *) echo "athena: unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        chmod +x /athena/bin/app-$__t
        export CARGO_ATHENA_OUTPUT=/athena/result
        exec /athena/bin/app-$__t "$@"
      - --
      - '{{inputs.parameters.tag}}'
      - '{{inputs.parameters.zone}}'
      env:
      - name: CARGO_ATHENA_TEMPLATE
        value: cargo-athena-example-smoke-run-svc
      - name: LOG_LEVEL
        value: info
      - name: REGION
        value: us-{{=fromJSON(inputs.parameters['zone'])}}
      volumeMounts:
      - name: athena-work
        mountPath: /athena
      - name: host-aee8d5824d48bc20
        mountPath: /dev/shm
      - name: host-ba155970169f1f8b
        mountPath: /certs
        readOnly: true
      securityContext:
        privileged: true
    volumes:
    - name: athena-work
      emptyDir: {}
    - name: host-aee8d5824d48bc20
      hostPath:
        path: /dev/shm
    - name: host-ba155970169f1f8b
      hostPath:
        path: /etc/ca-certs
    serviceAccountName: default
  volumeClaimTemplates:
  - metadata:
      name: cargo-athena-example-smoke-buildcache
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
