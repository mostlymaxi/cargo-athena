apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pipeline-retry
spec:
  entrypoint: cargo-athena-example-smoke-pipeline-retry
  templates:
  - name: cargo-athena-example-smoke-pipeline-retry
    dag:
      tasks:
      - name: flaky
        arguments: {}
        templateRef:
          name: cargo-athena-example-smoke-flaky
          template: cargo-athena-example-smoke-flaky
      - name: flaky-forever
        arguments: {}
        templateRef:
          name: cargo-athena-example-smoke-flaky-forever
          template: cargo-athena-example-smoke-flaky-forever
    retryStrategy:
      limit: 2
