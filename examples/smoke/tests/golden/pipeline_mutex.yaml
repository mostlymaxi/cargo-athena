apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pipeline-mutex
  labels:
    app.kubernetes.io/component: smoke-mutex
    app.kubernetes.io/managed-by: cargo-athena
    app.kubernetes.io/name: cargo-athena-example-smoke
    app.kubernetes.io/version: 0.0.0
    cargo.athena/version: 0.5.2
spec:
  entrypoint: cargo-athena-example-smoke-pipeline-mutex
  templates:
  - name: cargo-athena-example-smoke-pipeline-mutex
    inputs:
      parameters:
      - name: env
    dag:
      tasks:
      - name: shard-writer
        arguments:
          parameters:
          - name: shard
            value: '{{inputs.parameters.env}}'
        templateRef:
          name: cargo-athena-example-smoke-shard-writer
          template: cargo-athena-example-smoke-shard-writer
    synchronization:
      mutexes:
      - name: pipeline-dag
  synchronization:
    mutexes:
    - name: global-deploy-{{=fromJSON(workflow.parameters['env'])}}
      namespace: ops-{{=fromJSON(workflow.parameters['env'])}}
  volumeClaimTemplates:
  - metadata:
      name: cargo-athena-example-smoke-buildcache
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-shard-writer
  labels:
    app.kubernetes.io/component: smoke-mutex
    app.kubernetes.io/managed-by: cargo-athena
    app.kubernetes.io/name: cargo-athena-example-smoke
    app.kubernetes.io/version: 0.0.0
    cargo.athena/version: 0.5.2
spec:
  entrypoint: cargo-athena-example-smoke-shard-writer
  templates:
  - name: cargo-athena-example-smoke-shard-writer
    inputs:
      parameters:
      - name: shard
      artifacts:
      - name: athena-dist
        path: /athena/bin
        s3:
          endpoint: s3.amazonaws.com
          bucket: athena-artifacts
          region: us-east-1
          key: cargo-athena-example-smoke/0.0.0/smoke-mutex.tar.gz
          accessKeySecret:
            name: athena-s3
            key: accessKey
          secretKeySecret:
            name: athena-s3
            key: secretKey
    outputs:
      parameters:
      - name: return
        valueFrom:
          path: /athena/result
    container:
      image: busybox:1.36-musl
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -e
        case "$(uname -m)" in
          x86_64) __t=x86_64-unknown-linux-musl ;;
          aarch64|arm64) __t=aarch64-unknown-linux-musl ;;
          *) echo "athena: unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        chmod +x /athena/bin/app-$__t
        export CARGO_ATHENA_OUTPUT=/athena/result
        exec /athena/bin/app-$__t "$@"
      - --
      - '{{inputs.parameters.shard}}'
      env:
      - name: CARGO_ATHENA_TEMPLATE
        value: cargo-athena-example-smoke-shard-writer
      volumeMounts:
      - name: athena-work
        mountPath: /athena
    volumes:
    - name: athena-work
      emptyDir: {}
    serviceAccountName: default
    synchronization:
      mutexes:
      - name: shard-{{=fromJSON(inputs.parameters['shard'])}}
  volumeClaimTemplates:
  - metadata:
      name: cargo-athena-example-smoke-buildcache
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
