apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-cleanup
spec:
  entrypoint: cargo-athena-example-smoke-cleanup
  templates:
  - name: cargo-athena-example-smoke-cleanup
    inputs:
      artifacts:
      - name: athena-dist
        path: /athena/dist.tar.gz
        s3:
          endpoint: s3.amazonaws.com
          bucket: athena-artifacts
          region: us-east-1
          key: athena/bin/example/0.1.0/app.tar.gz
          accessKeySecret:
            name: athena-s3
            key: accessKey
          secretKeySecret:
            name: athena-s3
            key: secretKey
        archive:
          none: {}
    outputs:
      parameters:
      - name: return
        valueFrom:
          path: /athena/result
    container:
      image: busybox:1.36-musl
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -e
        case "$(uname -m)" in
          x86_64) __t=x86_64-unknown-linux-musl ;;
          aarch64|arm64) __t=aarch64-unknown-linux-musl ;;
          *) echo "athena: unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        mkdir -p /athena/bin
        tar -xzf /athena/dist.tar.gz -C /athena/bin
        chmod +x /athena/bin/app-$__t
        export CARGO_ATHENA_OUTPUT=/athena/result
        exec /athena/bin/app-$__t --cargo-athena-template cargo-athena-example-smoke-cleanup
      volumeMounts:
      - name: athena-work
        mountPath: /athena
    volumes:
    - name: athena-work
      emptyDir: {}
    serviceAccountName: default
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pipeline-ttl
spec:
  entrypoint: cargo-athena-example-smoke-pipeline-ttl
  templates:
  - name: cargo-athena-example-smoke-pipeline-ttl
    dag:
      tasks:
      - name: cleanup
        arguments: {}
        templateRef:
          name: cargo-athena-example-smoke-cleanup
          template: cargo-athena-example-smoke-cleanup
  ttlStrategy:
    secondsAfterCompletion: 86400
    secondsAfterFailure: 3600
  podGC:
    strategy: OnWorkflowSuccess
