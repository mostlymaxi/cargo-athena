apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pipeline-nested
spec:
  entrypoint: cargo-athena-example-smoke-pipeline-nested
  templates:
  - name: cargo-athena-example-smoke-pipeline-nested
    dag:
      tasks:
      - name: decide
        arguments:
          parameters:
          - name: seed
            value: '"xx"'
        templateRef:
          name: cargo-athena-example-smoke-decide
          template: cargo-athena-example-smoke-decide
      - name: left
        dependencies:
        - decide
        arguments:
          parameters:
          - name: x
            value: '{{tasks.decide.outputs.parameters.return}}'
        templateRef:
          name: cargo-athena-example-smoke-left
          template: cargo-athena-example-smoke-left
      - name: note
        dependencies:
        - left
        arguments:
          parameters:
          - name: msg
            value: '{{tasks.left.outputs.parameters.return}}'
        templateRef:
          name: cargo-athena-example-smoke-note
          template: cargo-athena-example-smoke-note
      - name: decide-2
        arguments:
          parameters:
          - name: seed
            value: '"yy"'
        templateRef:
          name: cargo-athena-example-smoke-decide
          template: cargo-athena-example-smoke-decide
      - name: if
        dependencies:
        - decide-2
        arguments:
          parameters:
          - name: __athena_cond_0
            value: '{{tasks.decide-2.outputs.parameters.return}}'
        templateRef:
          name: cargo-athena-example-smoke-pipeline-nested-if0
          template: cargo-athena-example-smoke-pipeline-nested-if0
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pipeline-nested-if0
spec:
  entrypoint: cargo-athena-example-smoke-pipeline-nested-if0
  templates:
  - name: cargo-athena-example-smoke-pipeline-nested-if0
    inputs:
      parameters:
      - name: __athena_cond_0
    dag:
      tasks:
      - name: arm0
        arguments:
          parameters:
          - name: __athena_cond_0
            value: '{{inputs.parameters.__athena_cond_0}}'
        templateRef:
          name: cargo-athena-example-smoke-pipeline-nested-if0-arm0
          template: cargo-athena-example-smoke-pipeline-nested-if0-arm0
        when: ({{inputs.parameters.__athena_cond_0}} > 1)
      - name: arm1
        arguments:
          parameters:
          - name: __athena_cond_0
            value: '{{inputs.parameters.__athena_cond_0}}'
        templateRef:
          name: cargo-athena-example-smoke-pipeline-nested-if0-arm1
          template: cargo-athena-example-smoke-pipeline-nested-if0-arm1
        when: '!(({{inputs.parameters.__athena_cond_0}} > 1))'
---
