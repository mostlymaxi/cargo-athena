apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-caps
spec:
  entrypoint: cargo-athena-example-smoke-caps
  templates:
  - name: cargo-athena-example-smoke-caps
    inputs:
      parameters:
      - name: s
      - name: suffix
      artifacts:
      - name: athena-dist
        path: /athena/bin
        s3:
          endpoint: s3.amazonaws.com
          bucket: athena-artifacts
          region: us-east-1
          key: cargo-athena-example-smoke/0.0.0/smoke-fanout.tar.gz
          accessKeySecret:
            name: athena-s3
            key: accessKey
          secretKeySecret:
            name: athena-s3
            key: secretKey
    outputs:
      parameters:
      - name: return
        valueFrom:
          path: /athena/result
    container:
      image: busybox:1.36-musl
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -e
        case "$(uname -m)" in
          x86_64) __t=x86_64-unknown-linux-musl ;;
          aarch64|arm64) __t=aarch64-unknown-linux-musl ;;
          *) echo "athena: unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        chmod +x /athena/bin/app-$__t
        export CARGO_ATHENA_OUTPUT=/athena/result
        exec /athena/bin/app-$__t "$@"
      - --
      - '{{inputs.parameters.s}}'
      - '{{inputs.parameters.suffix}}'
      env:
      - name: CARGO_ATHENA_TEMPLATE
        value: cargo-athena-example-smoke-caps
      volumeMounts:
      - name: athena-work
        mountPath: /athena
    volumes:
    - name: athena-work
      emptyDir: {}
    serviceAccountName: default
  volumeClaimTemplates:
  - metadata:
      name: cargo-athena-example-smoke-buildcache
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
---
