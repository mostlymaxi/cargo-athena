apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pipeline-fanout
spec:
  entrypoint: cargo-athena-example-smoke-pipeline-fanout
  templates:
  - name: cargo-athena-example-smoke-pipeline-fanout
    dag:
      tasks:
      - name: a
        arguments: {}
        templateRef:
          name: cargo-athena-example-smoke-make-list
          template: cargo-athena-example-smoke-make-list
      - name: b
        dependencies:
        - a
        arguments:
          parameters:
          - name: s
            value: '{{item}}'
          - name: suffix
            value: '"!"'
        templateRef:
          name: cargo-athena-example-smoke-caps
          template: cargo-athena-example-smoke-caps
        withParam: '{{tasks.a.outputs.parameters.return}}'
      - name: summarize
        dependencies:
        - b
        arguments:
          parameters:
          - name: items
            value: '{{=toJSON(map(fromJSON(tasks[''b''].outputs.parameters[''return'']), { type(#) == "string" ? fromJSON(#) : # }))}}'
        templateRef:
          name: cargo-athena-example-smoke-summarize
          template: cargo-athena-example-smoke-summarize
  volumeClaimTemplates:
  - metadata:
      name: cargo-athena-example-smoke-buildcache
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
---
