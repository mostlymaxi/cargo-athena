apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pipeline-pvc
  labels:
    cargo.athena/bin: smoke-pvc
    cargo.athena/pkg: cargo-athena-example-smoke
    cargo.athena/toolchain: 0.5.2
    cargo.athena/version: 0.0.0
spec:
  entrypoint: cargo-athena-example-smoke-pipeline-pvc
  templates:
  - name: cargo-athena-example-smoke-pipeline-pvc
    dag:
      tasks:
      - name: pvc-writer
        arguments: {}
        templateRef:
          name: cargo-athena-example-smoke-pvc-writer
          template: cargo-athena-example-smoke-pvc-writer
      - name: pvc-reader
        arguments: {}
        templateRef:
          name: cargo-athena-example-smoke-pvc-reader
          template: cargo-athena-example-smoke-pvc-reader
  volumeClaimTemplates:
  - metadata:
      name: cargo-athena-example-smoke-buildcache
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pvc-reader
  labels:
    cargo.athena/bin: smoke-pvc
    cargo.athena/pkg: cargo-athena-example-smoke
    cargo.athena/toolchain: 0.5.2
    cargo.athena/version: 0.0.0
spec:
  entrypoint: cargo-athena-example-smoke-pvc-reader
  templates:
  - name: cargo-athena-example-smoke-pvc-reader
    inputs:
      artifacts:
      - name: athena-dist
        path: /athena/bin
        s3:
          endpoint: s3.amazonaws.com
          bucket: athena-artifacts
          region: us-east-1
          key: cargo-athena-example-smoke/0.0.0/smoke-pvc.tar.gz
          accessKeySecret:
            name: athena-s3
            key: accessKey
          secretKeySecret:
            name: athena-s3
            key: secretKey
    outputs:
      parameters:
      - name: return
        valueFrom:
          path: /athena/result
    container:
      image: busybox:1.36-musl
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -e
        case "$(uname -m)" in
          x86_64) __t=x86_64-unknown-linux-musl ;;
          aarch64|arm64) __t=aarch64-unknown-linux-musl ;;
          *) echo "athena: unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        chmod +x /athena/bin/app-$__t
        export CARGO_ATHENA_OUTPUT=/athena/result
        exec /athena/bin/app-$__t "$@"
      - --
      env:
      - name: CARGO_ATHENA_TEMPLATE
        value: cargo-athena-example-smoke-pvc-reader
      volumeMounts:
      - name: athena-work
        mountPath: /athena
      - name: pvc-e052c09e53d539f7
        mountPath: /athena/pvcs/e052c09e53d539f7
    volumes:
    - name: athena-work
      emptyDir: {}
    - name: pvc-e052c09e53d539f7
      persistentVolumeClaim:
        claimName: cargo-athena-example-smoke-buildcache
    serviceAccountName: default
  volumeClaimTemplates:
  - metadata:
      name: cargo-athena-example-smoke-buildcache
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
---
