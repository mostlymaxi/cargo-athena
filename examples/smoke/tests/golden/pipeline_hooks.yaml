apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-fetch
spec:
  entrypoint: cargo-athena-example-smoke-fetch
  templates:
  - name: cargo-athena-example-smoke-fetch
    inputs:
      parameters:
      - name: url
      artifacts:
      - name: athena-dist
        path: /athena/dist.tar.gz
        s3:
          endpoint: s3.amazonaws.com
          bucket: athena-artifacts
          region: us-east-1
          key: athena/bin/example/0.1.0/app.tar.gz
          accessKeySecret:
            name: athena-s3
            key: accessKey
          secretKeySecret:
            name: athena-s3
            key: secretKey
        archive:
          none: {}
    outputs:
      parameters:
      - name: return
        valueFrom:
          path: /athena/result
    container:
      image: ghcr.io/acme/fetch:1.2.3
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -e
        case "$(uname -m)" in
          x86_64) __t=x86_64-unknown-linux-musl ;;
          aarch64|arm64) __t=aarch64-unknown-linux-musl ;;
          *) echo "athena: unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        mkdir -p /athena/bin
        tar -xzf /athena/dist.tar.gz -C /athena/bin
        chmod +x /athena/bin/app-$__t
        export CARGO_ATHENA_OUTPUT=/athena/result
        exec /athena/bin/app-$__t --cargo-athena-template cargo-athena-example-smoke-fetch
      env:
      - name: ATHENA_PARAM_url
        value: '{{inputs.parameters.url}}'
      volumeMounts:
      - name: athena-work
        mountPath: /athena
      - name: host-secrets-token
        mountPath: /secrets/token
    volumes:
    - name: athena-work
      emptyDir: {}
    - name: host-secrets-token
      hostPath:
        path: /secrets/token
    serviceAccountName: default
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pipeline-hooks
spec:
  entrypoint: cargo-athena-example-smoke-pipeline-hooks
  templates:
  - name: cargo-athena-example-smoke-pipeline-hooks
    dag:
      tasks:
      - name: raw
        arguments:
          parameters:
          - name: url
            value: https://example.com
        templateRef:
          name: cargo-athena-example-smoke-fetch
          template: cargo-athena-example-smoke-fetch
        continueOn:
          error: true
          failed: true
      - name: transform
        dependencies:
        - raw
        arguments:
          parameters:
          - name: data
            value: '{{tasks.raw.outputs.parameters.return}}'
          - name: factor
            value: '9'
        templateRef:
          name: cargo-athena-example-smoke-transform
          template: cargo-athena-example-smoke-transform
        hooks:
          exit:
            templateRef:
              name: cargo-athena-example-smoke-cleanup
              template: cargo-athena-example-smoke-cleanup
          hook1:
            templateRef:
              name: cargo-athena-example-smoke-alarm
              template: cargo-athena-example-smoke-alarm
            expression: tasks['transform'].status == "Failed"
          hook2:
            templateRef:
              name: cargo-athena-example-smoke-alarm
              template: cargo-athena-example-smoke-alarm
            expression: workflow.status == 'Failed'
---
