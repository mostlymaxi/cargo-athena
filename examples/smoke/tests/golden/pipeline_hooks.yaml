apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pipeline-hooks-0-0-0
  labels:
    cargo.athena/bin: smoke-hooks
    cargo.athena/channel: release
    cargo.athena/pkg: cargo-athena-example-smoke
    cargo.athena/tag: 0-0-0
    cargo.athena/toolchain: 0.5.2
    cargo.athena/version: 0.0.0
spec:
  entrypoint: cargo-athena-example-smoke-pipeline-hooks
  templates:
  - name: cargo-athena-example-smoke-pipeline-hooks
    dag:
      tasks:
      - name: raw
        arguments:
          parameters:
          - name: url
            value: '"https://example.com"'
        templateRef:
          name: cargo-athena-example-smoke-fetch-0-0-0
          template: cargo-athena-example-smoke-fetch
        continueOn:
          error: true
          failed: true
      - name: transform
        dependencies:
        - raw
        arguments:
          parameters:
          - name: data
            value: '{{tasks.raw.outputs.parameters.return}}'
          - name: factor
            value: '9'
        templateRef:
          name: cargo-athena-example-smoke-transform-0-0-0
          template: cargo-athena-example-smoke-transform
        hooks:
          exit:
            templateRef:
              name: cargo-athena-example-smoke-cleanup-0-0-0
              template: cargo-athena-example-smoke-cleanup
          hook1:
            templateRef:
              name: cargo-athena-example-smoke-alarm-0-0-0
              template: cargo-athena-example-smoke-alarm
            expression: tasks['transform'].status == "Failed"
          hook2:
            templateRef:
              name: cargo-athena-example-smoke-alarm-0-0-0
              template: cargo-athena-example-smoke-alarm
            expression: workflow.status == 'Failed'
  volumeClaimTemplates:
  - metadata:
      name: cargo-athena-example-smoke-buildcache
    spec:
      accessModes:
      - ReadWriteMany
      resources:
        requests:
          storage: 10Gi
      storageClassName: fast-ssd
---
