apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-ingest
spec:
  entrypoint: cargo-athena-example-smoke-ingest
  templates:
  - name: cargo-athena-example-smoke-ingest
    inputs:
      parameters:
      - name: source
    outputs:
      parameters:
      - name: return
        valueFrom:
          parameter: '{{tasks.clean.outputs.parameters.return}}'
    dag:
      tasks:
      - name: raw
        arguments:
          parameters:
          - name: url
            value: '{{inputs.parameters.source}}'
        templateRef:
          name: cargo-athena-example-smoke-fetch
          template: cargo-athena-example-smoke-fetch
      - name: clean
        dependencies:
        - raw
        arguments:
          parameters:
          - name: data
            value: '{{tasks.raw.outputs.parameters.return}}'
          - name: factor
            value: '2'
        templateRef:
          name: cargo-athena-example-smoke-transform
          template: cargo-athena-example-smoke-transform
      - name: publish
        dependencies:
        - clean
        arguments:
          parameters:
          - name: report
            value: '{{tasks.clean.outputs.parameters.return}}'
        templateRef:
          name: cargo-athena-example-smoke-publish
          template: cargo-athena-example-smoke-publish
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-pipeline
spec:
  entrypoint: cargo-athena-example-smoke-pipeline
  templates:
  - name: cargo-athena-example-smoke-pipeline
    dag:
      tasks:
      - name: a
        arguments:
          parameters:
          - name: source
            value: https://example.com/data
        templateRef:
          name: cargo-athena-example-smoke-ingest
          template: cargo-athena-example-smoke-ingest
      - name: branchy
        arguments:
          parameters:
          - name: mode
            value: fast
        templateRef:
          name: cargo-athena-example-smoke-branchy
          template: cargo-athena-example-smoke-branchy
      - name: t
        arguments:
          parameters:
          - name: data
            value: seed
          - name: factor
            value: '3'
        templateRef:
          name: cargo-athena-example-smoke-transform
          template: cargo-athena-example-smoke-transform
      - name: combine
        dependencies:
        - a
        - t
        arguments:
          parameters:
          - name: x
            value: '{{tasks.a.outputs.parameters.return}}'
          - name: y
            value: '{{tasks.t.outputs.parameters.return}}'
        templateRef:
          name: cargo-athena-example-smoke-combine
          template: cargo-athena-example-smoke-combine
---
