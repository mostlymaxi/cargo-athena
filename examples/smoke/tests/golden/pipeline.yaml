apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-smoke-branchy
spec:
  entrypoint: cargo-athena-example-smoke-branchy
  templates:
  - name: cargo-athena-example-smoke-branchy
    inputs:
      parameters:
      - name: mode
      artifacts:
      - name: athena-dist
        path: /athena/dist.tar.gz
        s3:
          endpoint: s3.amazonaws.com
          bucket: athena-artifacts
          region: us-east-1
          key: athena/bin/example/0.1.0/app.tar.gz
          accessKeySecret:
            name: athena-s3
            key: accessKey
          secretKeySecret:
            name: athena-s3
            key: secretKey
        archive:
          none: {}
    outputs:
      parameters:
      - name: return
        valueFrom:
          path: /athena/result
    container:
      image: ghcr.io/acme/tools:latest
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -e
        case "$(uname -m)" in
          x86_64) __t=x86_64-unknown-linux-musl ;;
          aarch64|arm64) __t=aarch64-unknown-linux-musl ;;
          *) echo "athena: unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        mkdir -p /athena/bin
        tar -xzf /athena/dist.tar.gz -C /athena/bin
        chmod +x /athena/bin/app-$__t
        export CARGO_ATHENA_OUTPUT=/athena/result
        exec /athena/bin/app-$__t --cargo-athena-template cargo-athena-example-smoke-branchy
      env:
      - name: ATHENA_PARAM_mode
        value: '{{inputs.parameters.mode}}'
      volumeMounts:
      - name: athena-work
        mountPath: /athena
      - name: host-cache-fast
        mountPath: /cache/fast
      - name: host-cache-slow
        mountPath: /cache/slow
      - name: host-data-default
        mountPath: /data/default
      - name: host-data-empty
        mountPath: /data/empty
      - name: host-var-lib-a
        mountPath: /var/lib/a
      - name: host-var-lib-b
        mountPath: /var/lib/b
    volumes:
    - name: athena-work
      emptyDir: {}
    - name: host-cache-fast
      hostPath:
        path: /cache/fast
    - name: host-cache-slow
      hostPath:
        path: /cache/slow
    - name: host-data-default
      hostPath:
        path: /data/default
    - name: host-data-empty
      hostPath:
        path: /data/empty
    - name: host-var-lib-a
      hostPath:
        path: /var/lib/a
    - name: host-var-lib-b
      hostPath:
        path: /var/lib/b
    serviceAccountName: default
---
