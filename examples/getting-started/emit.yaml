apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-getting-started-fetch-0-0-0
  labels:
    cargo.athena/bin: cargo-athena-example-getting-started
    cargo.athena/channel: release
    cargo.athena/pkg: cargo-athena-example-getting-started
    cargo.athena/tag: 0-0-0
    cargo.athena/toolchain: 0.6.2
    cargo.athena/version: 0.0.0
spec:
  entrypoint: cargo-athena-example-getting-started-fetch
  templates:
  - name: cargo-athena-example-getting-started-fetch
    inputs:
      parameters:
      - name: url
      artifacts:
      - name: athena-dist
        path: /athena/bin
        s3:
          endpoint: s3.amazonaws.com
          bucket: athena-artifacts
          region: us-east-1
          key: cargo-athena-example-getting-started/0-0-0/cargo-athena-example-getting-started.tar.gz
          accessKeySecret:
            name: athena-s3
            key: accessKey
          secretKeySecret:
            name: athena-s3
            key: secretKey
    outputs:
      parameters:
      - name: return
        valueFrom:
          path: /athena/result
    container:
      image: ghcr.io/acme/app:latest
      command:
      - /bin/sh
      - -c
      args:
      - |
        set -e
        case "$(uname -m)" in
          x86_64) __t=x86_64-unknown-linux-musl ;;
          aarch64|arm64) __t=aarch64-unknown-linux-musl ;;
          *) echo "athena: unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        chmod +x /athena/bin/app-$__t
        export CARGO_ATHENA_OUTPUT=/athena/result
        exec /athena/bin/app-$__t "$@"
      - --
      - '{{inputs.parameters.url}}'
      env:
      - name: CARGO_ATHENA_TEMPLATE
        value: cargo-athena-example-getting-started-fetch
      volumeMounts:
      - name: athena-work
        mountPath: /athena
    volumes:
    - name: athena-work
      emptyDir: {}
    serviceAccountName: default
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-getting-started-pipeline-0-0-0
  labels:
    cargo.athena/bin: cargo-athena-example-getting-started
    cargo.athena/channel: release
    cargo.athena/pkg: cargo-athena-example-getting-started
    cargo.athena/tag: 0-0-0
    cargo.athena/toolchain: 0.6.2
    cargo.athena/version: 0.0.0
spec:
  entrypoint: cargo-athena-example-getting-started-pipeline
  templates:
  - name: cargo-athena-example-getting-started-pipeline
    dag:
      tasks:
      - name: raw
        arguments:
          parameters:
          - name: url
            value: '"https://example.com/data"'
        templateRef:
          name: cargo-athena-example-getting-started-fetch-0-0-0
          template: cargo-athena-example-getting-started-fetch
      - name: summary
        dependencies:
        - raw
        arguments:
          parameters:
          - name: data
            value: '{{tasks.raw.outputs.parameters.return}}'
          - name: top_n
            value: '3'
        templateRef:
          name: cargo-athena-example-getting-started-summarize-0-0-0
          template: cargo-athena-example-getting-started-summarize
      - name: publish
        dependencies:
        - summary
        arguments:
          parameters:
          - name: report
            value: '{{tasks.summary.outputs.parameters.return}}'
        templateRef:
          name: cargo-athena-example-getting-started-publish-0-0-0
          template: cargo-athena-example-getting-started-publish
---
