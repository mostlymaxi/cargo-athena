[package]
name = "cargo-athena-example-e2e-consumer"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

# Proves cross-CRATE composition: depends on the e2e fixture crate,
# imports its `pipeline`, and composes it with local templates. Its golden
# must contain the upstream `cargo-athena-example-e2e-*` templates — that is
# the empirical proof the type-wormhole force-links across crates.
[lib]
name = "cargo_athena_example_e2e_consumer"
path = "src/lib.rs"

[[bin]]
name = "e2e-consumer"
path = "src/main.rs"

[dependencies]
cargo-athena = { workspace = true }
cargo-athena-example-e2e = { path = "../e2e" }
