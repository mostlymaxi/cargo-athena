apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-e2e-branchy
spec:
  entrypoint: cargo-athena-example-e2e-branchy
  templates:
  - name: cargo-athena-example-e2e-branchy
    inputs:
      parameters:
      - name: mode
    outputs:
      parameters:
      - name: result
        valueFrom:
          path: /tmp/cargo-athena/result
    container:
      image: ghcr.io/acme/tools:latest
      command:
      - app
      args:
      - --cargo-athena-template
      - cargo-athena-example-e2e-branchy
      volumeMounts:
      - name: host-cache-fast
        mountPath: /cache/fast
      - name: host-cache-slow
        mountPath: /cache/slow
      - name: host-data-default
        mountPath: /data/default
      - name: host-data-empty
        mountPath: /data/empty
      - name: host-var-lib-a
        mountPath: /var/lib/a
      - name: host-var-lib-b
        mountPath: /var/lib/b
    volumes:
    - name: host-cache-fast
      hostPath:
        path: /cache/fast
    - name: host-cache-slow
      hostPath:
        path: /cache/slow
    - name: host-data-default
      hostPath:
        path: /data/default
    - name: host-data-empty
      hostPath:
        path: /data/empty
    - name: host-var-lib-a
      hostPath:
        path: /var/lib/a
    - name: host-var-lib-b
      hostPath:
        path: /var/lib/b
---
