apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-e2e-consumer-consumer-pipeline
spec:
  entrypoint: cargo-athena-example-e2e-consumer-consumer-pipeline
  templates:
  - name: cargo-athena-example-e2e-consumer-consumer-pipeline
    dag:
      tasks:
      - name: n
        arguments:
          parameters:
          - name: note
            value: hello
        templateRef:
          name: cargo-athena-example-e2e-consumer-consumer-step
          template: cargo-athena-example-e2e-consumer-consumer-step
      - name: pipeline
        arguments: {}
        templateRef:
          name: cargo-athena-example-e2e-pipeline
          template: cargo-athena-example-e2e-pipeline
      - name: finalize
        dependencies:
        - n
        arguments:
          parameters:
          - name: x
            value: '{{tasks.n.outputs.result}}'
        templateRef:
          name: cargo-athena-example-e2e-consumer-finalize
          template: cargo-athena-example-e2e-consumer-finalize
---
