apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-e2e-fetch
spec:
  entrypoint: cargo-athena-example-e2e-fetch
  templates:
  - name: cargo-athena-example-e2e-fetch
    inputs:
      parameters:
      - name: url
    outputs:
      parameters:
      - name: result
        valueFrom:
          path: /tmp/cargo-athena/result
    container:
      image: ghcr.io/acme/fetch:1.2.3
      command:
      - /usr/local/bin/fetch
      args:
      - --cargo-athena-template
      - cargo-athena-example-e2e-fetch
      volumeMounts:
      - name: host-secrets-token
        mountPath: /secrets/token
    volumes:
    - name: host-secrets-token
      hostPath:
        path: /secrets/token
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-e2e-ingest
spec:
  entrypoint: cargo-athena-example-e2e-ingest
  templates:
  - name: cargo-athena-example-e2e-ingest
    inputs:
      parameters:
      - name: source
    dag:
      tasks:
      - name: raw
        arguments:
          parameters:
          - name: url
            value: '{{inputs.parameters.source}}'
        templateRef:
          name: cargo-athena-example-e2e-fetch
          template: cargo-athena-example-e2e-fetch
      - name: clean
        dependencies:
        - raw
        arguments:
          parameters:
          - name: data
            value: '{{tasks.raw.outputs.result}}'
          - name: factor
            value: '2'
        templateRef:
          name: cargo-athena-example-e2e-transform
          template: cargo-athena-example-e2e-transform
      - name: publish
        dependencies:
        - clean
        arguments:
          parameters:
          - name: report
            value: '{{tasks.clean.outputs.result}}'
        templateRef:
          name: cargo-athena-example-e2e-publish
          template: cargo-athena-example-e2e-publish
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cargo-athena-example-e2e-pipeline
spec:
  entrypoint: cargo-athena-example-e2e-pipeline
  templates:
  - name: cargo-athena-example-e2e-pipeline
    dag:
      tasks:
      - name: a
        arguments:
          parameters:
          - name: source
            value: https://example.com/data
        templateRef:
          name: cargo-athena-example-e2e-ingest
          template: cargo-athena-example-e2e-ingest
      - name: branchy
        arguments:
          parameters:
          - name: mode
            value: fast
        templateRef:
          name: cargo-athena-example-e2e-branchy
          template: cargo-athena-example-e2e-branchy
      - name: t
        arguments:
          parameters:
          - name: data
            value: seed
          - name: factor
            value: '3'
        templateRef:
          name: cargo-athena-example-e2e-transform
          template: cargo-athena-example-e2e-transform
      - name: combine
        dependencies:
        - a
        - t
        arguments:
          parameters:
          - name: x
            value: '{{tasks.a.outputs.result}}'
          - name: y
            value: '{{tasks.t.outputs.result}}'
        templateRef:
          name: cargo-athena-example-e2e-combine
          template: cargo-athena-example-e2e-combine
---
