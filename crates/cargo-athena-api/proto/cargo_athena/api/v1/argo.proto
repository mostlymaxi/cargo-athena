syntax = "proto3";

// A curated, self-contained subset of the Argo Workflows API.
//
// This is intentionally NOT the full upstream schema: the full
// argoproj/argo-workflows protos pull in the entire k8s apimachinery
// dependency graph. This subset is enough to emit valid Workflow YAML and
// gives us a stable seam — swapping in the upstream protos later only
// changes this file + buf.gen.yaml, not any downstream crate (see README).
package cargo_athena.api.v1;

message Workflow {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  WorkflowSpec spec = 4;
}

// A reusable, independently-addressable template resource. Every
// #[workflow]/#[container] emits exactly one of these; cross-template
// calls reference it by name via TemplateRef.
message WorkflowTemplate {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  WorkflowSpec spec = 4;
}

message ObjectMeta {
  string name = 1;
  string generate_name = 2;
  string namespace = 3;
  map<string, string> labels = 4;
  map<string, string> annotations = 5;
}

message WorkflowSpec {
  string entrypoint = 1;
  repeated Template templates = 2;
  Arguments arguments = 3;
  // Set on a runnable Workflow that just invokes a WorkflowTemplate.
  WorkflowTemplateRef workflow_template_ref = 4;
  string service_account_name = 5;
}

// Points a runnable Workflow at a WorkflowTemplate resource.
message WorkflowTemplateRef {
  string name = 1;
  bool cluster_scope = 2;
}

// A DAG task's reference to a template living in another
// WorkflowTemplate resource.
message TemplateRef {
  string name = 1;
  string template = 2;
  bool cluster_scope = 3;
}

message Template {
  string name = 1;
  Inputs inputs = 2;
  Outputs outputs = 3;
  // Exactly one of the following describes the template body.
  Container container = 4;
  DagTemplate dag = 5;
  ScriptTemplate script = 6;
  repeated Volume volumes = 7;
  // Per-template SA override (Argo runs the pod as this).
  string service_account_name = 8;
  // Template-level pod scheduling (container templates).
  map<string, string> node_selector = 9;
  // `#[workflow(steps)]` body: sequential step groups (Argo `steps`).
  repeated ParallelSteps steps = 10;
}

// Argo `steps` is a list of lists; the inner list runs in parallel, the
// outer runs sequentially. serde(transparent) so this serializes as the
// bare inner array. Reuses DagTask (its empty `dependencies` is omitted —
// steps order is implicit).
message ParallelSteps {
  repeated DagTask steps = 1;
}

message Inputs {
  repeated Parameter parameters = 1;
  repeated Artifact artifacts = 2;
}

message Outputs {
  repeated Parameter parameters = 1;
  repeated Artifact artifacts = 2;
}

message Parameter {
  string name = 1;
  optional string value = 2;
  optional string default = 3;
  ValueFrom value_from = 4;
}

message ValueFrom {
  string path = 1;
  string parameter = 2;
}

message Artifact {
  string name = 1;
  string path = 2;
  // Where the artifact lives. For cargo-athena this is the binary tarball.
  S3Artifact s3 = 3;
  // How the object is (un)packed. cargo-athena sets `none` and untars in
  // the bootstrap itself.
  ArchiveStrategy archive = 4;
  // Octal file mode applied to the downloaded file (e.g. 0o755).
  optional int32 mode = 5;
}

// Mirrors a k8s SecretKeySelector — points at a key in a Secret.
message SecretKeySelector {
  string name = 1;
  string key = 2;
}

// Mirrors Argo's S3Artifact.
message S3Artifact {
  string endpoint = 1;
  string bucket = 2;
  string region = 3;
  bool insecure = 4;
  string key = 5;
  SecretKeySelector access_key_secret = 6;
  SecretKeySelector secret_key_secret = 7;
}

message ArchiveStrategy {
  // Present (and empty) means "do not archive/extract".
  NoneStrategy none = 1;
}

message NoneStrategy {}

message Arguments {
  repeated Parameter parameters = 1;
  repeated Artifact artifacts = 2;
}

message DagTemplate {
  repeated DagTask tasks = 1;
}

message DagTask {
  string name = 1;
  // `template` (local) is empty when `template_ref` is set.
  string template = 2;
  repeated string dependencies = 3;
  Arguments arguments = 4;
  TemplateRef template_ref = 5;
}

message Container {
  string image = 1;
  repeated string command = 2;
  repeated string args = 3;
  repeated EnvVar env = 4;
  repeated VolumeMount volume_mounts = 5;
  string working_dir = 6;
}

message ScriptTemplate {
  string image = 1;
  repeated string command = 2;
  string source = 3;
}

message EnvVar {
  string name = 1;
  string value = 2;
}

message Volume {
  string name = 1;
  HostPathVolumeSource host_path = 2;
  EmptyDirVolumeSource empty_dir = 3;
}

message HostPathVolumeSource {
  string path = 1;
  string type = 2;
}

// Present (and empty) => a pod-scoped scratch dir (k8s emptyDir: {}).
message EmptyDirVolumeSource {}

message VolumeMount {
  string name = 1;
  string mount_path = 2;
  bool read_only = 3;
}
