[package]
name = "cargo-athena-macros"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "Proc macros for cargo-athena: #[workflow], #[container], #[fragment]"

[lib]
proc-macro = true

[dependencies]
# Pure name/path/env-var derivers (`munge` module). Proc-macro and
# emit-side both call into here so the two never drift.
cargo-athena-api = { workspace = true }
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
deluxe = { workspace = true }
# Encode literal arg values as JSON at macro time (Regime B: every param
# value is consistently JSON, so the run-side `from_str` and attribute
# `{{=fromJSON(...)}}` are always correct).
serde_json = { workspace = true }
# Parse `active_deadline = "1h30m"` durations at macro time.
humantime = { workspace = true }
