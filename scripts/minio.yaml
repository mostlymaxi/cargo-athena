# MinIO (artifact repository) pinned to the control-plane node, plus a
# one-shot Job that creates the bucket. Namespace: argo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: argo
  labels: { app: minio }
spec:
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      nodeSelector:
        athena.dev/role: control
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: minio
          # minio/minio is gone from Docker Hub and quay; same server.
          image: cgr.dev/chainguard/minio@sha256:3c60a2a8c4d33409a9bc7a623a7fcbfb4605adc3d89422d2f53b3f673a6e5597
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - { name: MINIO_ROOT_USER, value: athena }
            - { name: MINIO_ROOT_PASSWORD, value: athena12345 }
          ports:
            - { containerPort: 9000 }
            - { containerPort: 9001 }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 3
            periodSeconds: 3
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: argo
spec:
  selector: { app: minio }
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-mkbucket
  namespace: argo
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        athena.dev/role: control
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: mc
          image: cgr.dev/chainguard/minio-client@sha256:1dccd2a6fd59914a98ac2d9dad95e552c91243cb0bd7242aaa224802df4b3432
          # No shell in this image: the Job retries until minio is up.
          args: ["mb", "--ignore-existing", "m/athena-artifacts"]
          env:
            - { name: MC_HOST_m, value: "http://athena:athena12345@minio:9000" }
