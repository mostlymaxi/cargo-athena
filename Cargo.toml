# Workspace root for cargo-athena: compile regular Rust into Argo Workflow YAML.
#
# Crate roles:
#   cargo-athena-api    — hand-owned serde subset of the Argo Workflows API.
#   cargo-athena-core   — runtime: modes, registration (inventory), DAG types, YAML emit.
#   cargo-athena-macros — #[workflow] / #[container] / #[fragment] proc macros.
#   cargo-athena        — the crate users depend on: facade lib + the
#                         `cargo athena` CLI bin (default `cli` feature).
#   examples/*          — end-to-end usage.
[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
edition = "2024"
version = "0.4.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mostlymaxi/cargo-athena"

[workspace.dependencies]
cargo-athena-api = { path = "crates/cargo-athena-api", version = "0.4.0" }
cargo-athena-core = { path = "crates/cargo-athena-core", version = "0.4.0" }
cargo-athena-macros = { path = "crates/cargo-athena-macros", version = "0.4.0" }
# default-features=false: examples/tests consume the library exactly as
# we tell users to (lib only — no kube/reqwest/tokio/clap CLI tree). The
# `cargo-athena` package keeps its own `default = ["cli"]` for the bin.
cargo-athena = { path = "crates/cargo-athena", version = "0.4.0", default-features = false }

# proc-macro stack
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
deluxe = "0.5"
# Small, zero-dep duration parser — `active_deadline = "1h30m"` at macro time.
humantime = "2"
# Pure-Rust tar + gzip — the CLI packs/unpacks the binary tarball
# without shelling out to a host `tar` (single-source-of-truth tarball
# layout, deterministic output, portable to Windows). Both are tiny,
# well-maintained, MIT-licensed.
tar = "0.4"
flate2 = "1"

# protobuf / serialization
prost = "0.13"
prost-build = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
toml = "0.8"

# registration
inventory = "0.3"

# cli (optional — behind the `cli` feature of the cargo-athena crate)
clap = { version = "4", features = ["derive"] }
# `cargo athena container run` only: S3 pull/push + a lean single-thread
# async driver for it (CLI tool — no multi-thread runtime needed).
object_store = { version = "0.11", features = ["aws"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
# `cargo athena submit` only: kube-rs (kubeconfig/in-cluster + exec-auth,
# the universal path) and reqwest (the Argo Server REST path). rustls so
# there's no system OpenSSL requirement. NO k8s-openapi (DynamicObject).
kube = { version = "0.99", default-features = false, features = ["client", "rustls-tls"] }
# kube's client pulls k8s-openapi, whose build script requires the
# top binary crate to pick a k8s version. We only use DynamicObject
# (untyped), so `latest` is fine — the version is immaterial.
k8s-openapi = { version = "0.24", features = ["latest"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
