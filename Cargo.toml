# Workspace root for cargo-athena: compile regular Rust into Argo Workflow YAML.
#
# Crate roles:
#   cargo-athena-api    — hand-owned serde subset of the Argo Workflows API.
#   cargo-athena-core   — runtime: modes, registration (inventory), DAG types, YAML emit.
#   cargo-athena-macros — #[workflow] / #[container] / #[fragment] proc macros.
#   cargo-athena        — the crate users depend on: facade lib + the
#                         `cargo athena` CLI bin (default `cli` feature).
#   examples/*          — end-to-end usage.
[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
edition = "2024"
version = "0.1.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mostlymaxi/cargo-athena"

[workspace.dependencies]
cargo-athena-api = { path = "crates/cargo-athena-api", version = "0.1.0" }
cargo-athena-core = { path = "crates/cargo-athena-core", version = "0.1.0" }
cargo-athena-macros = { path = "crates/cargo-athena-macros", version = "0.1.0" }
cargo-athena = { path = "crates/cargo-athena", version = "0.1.0" }

# proc-macro stack
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
deluxe = "0.5"

# protobuf / serialization
prost = "0.13"
prost-build = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
toml = "0.8"

# registration
inventory = "0.3"

# cli (optional — behind the `cli` feature of the cargo-athena crate)
clap = { version = "4", features = ["derive"] }
